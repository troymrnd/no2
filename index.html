<!DOCTYPE html>
<html>
<head>
    <title>Pretty Please</title>
</head>
<body style="
    margin: 0; 
    padding: 0; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    background-color: #f7e6e9; /* Light pastel pink/purple background */
    font-family: Arial, sans-serif; 
    flex-direction: column;
">

    <div style="text-align: center; padding: 20px; max-width: 350px;">
        
        <img src="sadkit.gif" alt="Sad Crying Kitten Illustration" style="
            width: 150px; 
            height: 150px; 
            margin-bottom: 25px; 
            display: block; 
            margin-left: auto; 
            margin-right: auto;
            /* Note: The image illustration is not circular, so border-radius is removed/kept at 0 */
        ">
        
        <p style="
            color: #E950A9; /* Bright pink text color */
            font-size: 2.2em; /* Increased size for "PRETTY PLEASE?" */
            font-weight: 900; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-bottom: 50px; 
            line-height: 1.2;
            text-shadow: 1px 1px 0 #FFFFFF; 
        ">
            PRETTY PLEASE?
        </p>
        
        <div style="display: flex; flex-direction: column; gap: 25px; width: 100%;">
            
            <a href="https://troymrnd.github.io/happy/" style="
                text-decoration: none;
                padding: 15px 50px;
                border: 3px solid #FFFFFF; /* White outline */
                background-color: #FFFDFE; /* Very light fill */
                border-radius: 50px; /* Highly rounded corners */
                color: #C04390; /* Purplish-pink text */
                font-size: 1.4em;
                font-weight: bold;
                letter-spacing: 1px;
                text-transform: uppercase;
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 5px rgba(233, 80, 169, 0.5); /* Glow/shadow effect */
                display: block;
                min-width: 200px;
            ">
                OK FINE.
            </a>
            
        </div>
    </div>
</body>
</html>
